[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "news-category-classification"
version = "1.0.0"
description = "Multiclass news-article classification on AG News: TF-IDF + Logistic Regression / Linear SVM / Naive Bayes / Random Forest, with optional XGBoost, LightGBM and a Keras neural network."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "nltk>=3.8",
    "matplotlib>=3.7",
    "wordcloud>=1.9",
    "joblib>=1.3",
]

[project.optional-dependencies]
extra = ["xgboost>=2.0", "lightgbm>=4.0", "tensorflow>=2.15"]

[project.scripts]
news-train = "news_classification.train:main"
news-predict = "news_classification.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_notebook.py" = ["E501"]
